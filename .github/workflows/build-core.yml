name: Build WildPaqet Core v3

on:
  workflow_dispatch:
  push:
    branches:
      - wild-paqet-v3
    tags:
      - "core-v*"

concurrency:
  group: core-v3-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum

      - name: Install libpcap
        run: |
          sudo apt-get update
          sudo apt-get install -y libpcap-dev

      - name: Verify manager syntax
        run: bash -n wildpaqet.sh

      - name: Test manager pairing code
        run: bash .github/tests/pairing-code.sh

      - name: Test v3 manager pool and service refresh
        run: bash .github/tests/v3-manager.sh

      - name: Test full uninstall cleanup and state restoration
        run: bash .github/tests/uninstall-cleanup.sh

      - name: Test HTTP/2 cover at packet level
        working-directory: core
        run: go test -count=1 -run 'TestH2Cover(PacketLevelUsesRealPrefaceAndFrames|ClientHelloExposesOnlyPublicSNIAndALPN|TransportRoundTripAndDecoy)' ./internal/tnet/tls

      - name: Test core
        working-directory: core
        run: go test -count=1 ./...

      - name: Vet core
        working-directory: core
        run: go vet ./...

  build-linux:
    needs: [test]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goarch: amd64
            filename: amd64
            container: muslcc/x86_64:x86_64-linux-musl
            host: ""
          - goarch: arm64
            filename: arm64
            container: muslcc/x86_64:aarch64-linux-musl
            host: aarch64-linux-musl
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version label
        id: ref_id
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            REF_ID="${GITHUB_REF#refs/tags/}"
          else
            REF_ID="v3.0.0-wildpaqet-$(git rev-parse --short HEAD)"
          fi
          echo "ref=$REF_ID" >> "$GITHUB_OUTPUT"

      - name: Build static linux binary (musl)
        run: |
          mkdir -p dist
          docker run --rm -i \
            -v "$PWD:/src" -w /src/core \
            -e GOARCH=${{ matrix.goarch }} \
            -e FILENAME=${{ matrix.filename }} \
            -e HOST_TRIPLE='${{ matrix.host }}' \
            -e VERSION='${{ steps.ref_id.outputs.ref }}' \
            ${{ matrix.container }} \
            sh -eus <<'EOF'
          apk update
          apk add --no-cache git bash tar gzip wget flex bison linux-headers make

          GO_VERSION=$(awk '/^go / { print $2; exit }' /src/core/go.mod)
          GO_ARCHIVE=go${GO_VERSION}.linux-amd64.tar.gz
          wget -q https://dl.google.com/go/${GO_ARCHIVE}
          wget -q https://dl.google.com/go/${GO_ARCHIVE}.sha256
          printf '%s  %s\n' "$(cat ${GO_ARCHIVE}.sha256)" "${GO_ARCHIVE}" | sha256sum -c -
          tar -C /usr/local -xzf "${GO_ARCHIVE}"
          export PATH=$PATH:/usr/local/go/bin
          git config --global --add safe.directory /src

          LIBPCAP_VERSION=1.10.5
          wget -q https://www.tcpdump.org/release/libpcap-${LIBPCAP_VERSION}.tar.gz
          tar -xzf libpcap-${LIBPCAP_VERSION}.tar.gz
          cd libpcap-${LIBPCAP_VERSION}
          [ -n "$HOST_TRIPLE" ] && HOST_FLAG="--host=$HOST_TRIPLE" || HOST_FLAG=""
          ./configure ${HOST_FLAG} --prefix=/opt/libpcap \
            --disable-shared --disable-dbus --disable-bluetooth \
            --disable-usb --with-pcap=linux
          make -j$(nproc)
          make install
          cd /src/core

          export CGO_ENABLED=1 GOOS=linux CC=gcc
          export PKG_CONFIG_PATH=/opt/libpcap/lib/pkgconfig
          export CGO_CFLAGS="-I/opt/libpcap/include"
          export CGO_LDFLAGS="-L/opt/libpcap/lib -lpcap"
          export GIT_COMMIT=$(git -C /src rev-parse HEAD 2>/dev/null || echo unknown)
          export BUILD_TIME=$(date -u "+%Y-%m-%d %H:%M:%S UTC")

          go build -v -a -trimpath \
            -ldflags "-s -w -buildid= -linkmode external -extldflags '-static' \
            -X 'paqet/cmd/version.Version=${VERSION}' \
            -X 'paqet/cmd/version.GitCommit=${GIT_COMMIT}' \
            -X 'paqet/cmd/version.GitTag=${VERSION}' \
            -X 'paqet/cmd/version.BuildTime=${BUILD_TIME}'" \
            -o /src/paqet_linux_${FILENAME} ./cmd/main.go

          chmod +x /src/paqet_linux_${FILENAME}
          tar -czvf /src/dist/paqet-linux-${FILENAME}-${VERSION}.tar.gz \
            -C /src paqet_linux_${FILENAME} \
            -C /src/core README.md \
            example/client.yaml.example example/server.yaml.example \
            example/client-tls.yaml.example example/server-tls.yaml.example \
            -C /src docs/V3-INSTALL.md
          EOF

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: paqet-linux-${{ matrix.filename }}
          path: dist/paqet-linux-${{ matrix.filename }}-${{ steps.ref_id.outputs.ref }}.tar.gz
          retention-days: 14

  release:
    runs-on: ubuntu-latest
    needs: [build-linux]
    if: startsWith(github.ref, 'refs/tags/core-v')
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./dist
          pattern: paqet-*
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
